<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>FUD STAFF</title>
    <link rel="stylesheet" href="vendors/mdi/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="vendors/base/vendor.bundle.base.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="shortcut icon" href="images/favicon.png" />
    <style>
        body {
            background-color: #f7f8fa;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 123, 255, 0.1);
            border-radius: 15px;
            z-index: 0;
        }

        .login-container img {
            width: 50%;
            margin-bottom: 20px;
            z-index: 1;
            position: relative;
        }

        .login-container h2 {
            margin-bottom: 20px;
            color: #333;
            z-index: 1;
            position: relative;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-control {
            border: 1px solid #ced4da;
            border-radius: 10px;
            padding: 10px;
            width: 100%;
            transition: border-color 0.3s;
            z-index: 1;
            position: relative;
        }

        .form-control:focus {
            border-color: #007BFF;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }

        .btn-primary {
            background-color: #007BFF;
            border: none;
            border-radius: 10px;
            padding: 10px;
            color: white;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.3s;
            z-index: 1;
            position: relative;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .btn-danger {
            background: transparent;
            color: #dc3545;
            border: none;
            cursor: pointer;
            z-index: 1;
            position: relative;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 300px;
            border-radius: 10px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <img src="images/logo.png" alt="logo">
        <h2>FUD STAFF COOPERATIVE PORTAL</h2>
        <form id="frm-login">
            <div class="msg"></div>
            <div class="form-group">
                <label for="username">STAFF NUMBER (SP/JP NO.)</label>
                <input type="text" class="form-control" name="username" id="username" placeholder="SP/R/0000" required>
            </div>
            <div class="form-group">
                <label for="password">PASSWORD</label>
                <input type="password" class="form-control" name="password" id="password" placeholder="SP NUMBER AS DEFAULT PASSWORD" required>
            </div>
            <button type="submit" class="btn btn-primary" id="login">LOGIN</button>
            <button type="button" class="btn btn-danger mt-2" id="forgotPasswordBtn">Forgot Password</button>
        </form>
    </div>

    <div id="resetPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Reset Password</h2>
            <form id="resetPasswordForm">
                <label for="resetUsername">Username:</label>
                <input type="text" id="resetUsername" name="username" required><br><br>
                <input type="submit" value="Reset Password">
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#forgotPasswordBtn").click(function () {
                $("#resetPasswordModal").css("display", "block");
            });
            $(".close").click(function () {
                $("#resetPasswordModal").css("display", "none");
            });
            $("#resetPasswordForm").submit(function (event) {
                event.preventDefault();
                var username = $("#resetUsername").val();
                // Handle reset password logic here
                $("#resetPasswordForm")[0].reset();
                $("#resetPasswordModal").css("display", "none");
            });
        });
    </script>
    <script src="vendors/base/vendor.bundle.base.js"></script>
    <script src="js/off-canvas.js"></script>
    <script src="js/hoverable-collapse.js"></script>
    <script src="js/custom.js"></script>
</body>

</html>
