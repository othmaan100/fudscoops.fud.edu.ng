name: Deploy to FTP

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual deploys from the Actions tab

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload changed files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps          # explicit FTPS on port 21
          server-dir: ./          # the FTP account's root is the site root
          # Only changed files are uploaded; state is kept in .ftp-deploy-sync-state.json on the server.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            CHANGELOG.md
            db/**
            error_log
            **/error_log
            uploads/**
            config/db_config.php
