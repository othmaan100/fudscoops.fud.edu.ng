<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>FUD STAFF</title>
  <link rel="stylesheet" href="vendors/mdi/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="vendors/base/vendor.bundle.base.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="shortcut icon" href="images/favicon.png" />
  <style>
      body {
          background-color: #f8f9fa;
          font-family: 'Arial', sans-serif;
      }

      .auth {
          background: url('images/background.jpg') no-repeat center center; /* Add a background image */
          background-size: cover;
      }

      .notice {
          background-color: rgba(255, 255, 255, 0.9);
          padding: 30px;
          border-radius: 8px;
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      .p-header {
          color: #343a40;
      }

      .form-control {
          border: 1px solid #ced4da;
          border-radius: 5px;
      }

      .form-control:focus {
          border-color: #007BFF;
          box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
      }

      .btn-primary {
          background-color: #007BFF;
          border: none;
      }

      .btn-primary:hover {
          background-color: #0056b3;
      }

      .modal {
          display: none;
          position: fixed;
          z-index: 1;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          overflow: auto;
          background-color: rgba(0, 0, 0, 0.4);
      }

      .modal-content {
          background-color: #fefefe;
          margin: 15% auto;
          padding: 20px;
          border: 1px solid #888;
          width: 300px;
          border-radius: 8px;
      }

      .close {
          color: #aaa;
          float: right;
          font-size: 28px;
          font-weight: bold;
      }

      .close:hover,
      .close:focus {
          color: black;
          text-decoration: none;
          cursor: pointer;
      }
  </style>
</head>

<body>
  <div class="container-scroller">
    <div class="container-fluid page-body-wrapper full-page-wrapper">
      <div class="content-wrapper d-flex align-items-stretch auth auth-img-bg">
        <div class="row flex-grow">          
          <div class="col-lg-12 login-half-bg row">
            <div class="col-lg-4"></div>
            <div class="col-lg-4 notice">
                <img src="images/logo.png" width="40%" style="display:block;margin-left:auto;margin-right:auto;max-width:30%;" alt="logo">
                <div class="auth-form-transparent2 text-left p-3">
                    <h2 class="text-center p-header"><b>FUD STAFF COOPERATIVE PORTAL</b></h2>
                    <form class="pt-3" id="frm-login">
                        <div class="msg"></div>
                        <div class="form-group">
                            <label for="username">STAFF NUMBER (SP/JP NO.)</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text bg-transparent border-right-0">
                                        <i class="mdi mdi-account-outline text-primary"></i>
                                    </span>
                                </div>
                                <input type="text" class="form-control form-control-lg" name="username" id="username" placeholder="SP/R/0000" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="password">PASSWORD</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text bg-transparent border-right-0">
                                        <i class="mdi mdi-lock-outline text-primary"></i>
                                    </span>
                                </div>
                                <input type="password" class="form-control form-control-lg" name="password" id="password" placeholder="SP NUMBER AS DEFAULT PASSWORD" required>
                            </div>
                        </div>
                        <div class="my-3">
                            <button type="submit" class="btn btn-block btn-primary btn-lg font-weight-medium auth-form-btn" id="login">
                                LOGIN
                            </button>
                        </div>
                        <button type="button" class="btn btn-danger btn-sm font-weight-medium auth-form-btn" id="forgotPasswordBtn">
                            Forgot Password
                        </button>
                    </form>
                </div>
            </div>  
            <div id="resetPasswordModal" class="modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h2>Reset Password</h2>
                    <form id="resetPasswordForm">
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" required><br><br>
                        <input type="submit" value="Reset Password">
                    </form>
                </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
      $(document).ready(function() {
          $("#forgotPasswordBtn").click(function() {
              $("#resetPasswordModal").css("display", "block");
          });
          $(".close").click(function() {
              $("#resetPasswordModal").css("display", "none");
          });
          $("#resetPasswordForm").submit(function(event) {
              event.preventDefault();
              var username = $("#username").val();
              // Add AJAX call to handle password reset here
              $("#resetPasswordForm")[0].reset();
              $("#resetPasswordModal").css("display", "none");
          });
      });
  </script>
  <script src="vendors/base/vendor.bundle.base.js"></script>
  <script src="js/off-canvas.js"></script>
  <script src="js/hoverable-collapse.js"></script>
  <script src="js/custom.js"></script>
</body>

</html>
